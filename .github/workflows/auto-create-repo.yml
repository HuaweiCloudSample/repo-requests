name: 自动创建仓库（审批通过后）

on:
  issues:
    types: [labeled]

jobs:
  create-repo:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
      ORG_NAME: ${{ github.repository_owner }}

    steps:
      # ========== 1. 解析 Issue 正文 ==========
      - name: 解析 Issue 内容获取申请信息
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;

            function parseBody(body) {
              const lines = body.split('\n');
              const info = {};
              let currentKey = '';
              for (let line of lines) {
                const keyMatch = line.match(/^### (.+)/);
                if (keyMatch) {
                  currentKey = keyMatch[1].trim();
                  info[currentKey] = '';
                  continue;
                }
                if (line.startsWith('<!--') || line.trim() === '') continue;
                if (currentKey && info[currentKey] !== undefined) {
                  info[currentKey] += line.trim() + '\n';
                }
              }
              for (const key in info) {
                info[key] = info[key].trim();
              }
              return info;
            }

            const data = parseBody(issueBody);

            const repoNameRaw = data['建议的仓库名称'];
            const visibility = data['仓库可见性'] || '私有';
            const teamWrite = data['需要写入权限的成员或团队'];
            const teamAdmin = data['需要管理员权限的维护者'];
            const needCodeReview = data['是否启用强制代码审核（PR + 审批）？'];
            const needSignedCommits = data['是否要求提交签名（Verified commits）？'];

            if (!repoNameRaw) {
              throw new Error('未找到仓库名称，请检查 Issue 模板');
            }

            // 清理仓库名：去除组织前缀，替换空格为 -，移除非法字符，统一小写
            let repoNameClean = repoNameRaw.split('/').pop();
            repoNameClean = repoNameClean.replace(/\s+/g, '-')
                                         .replace(/[^a-zA-Z0-9\-_.]/g, '')
                                         .toLowerCase();

            let privateFlag = true;
            let isInternal = false;
            if (visibility.includes('公开')) {
              privateFlag = false;
              isInternal = false;
            } else if (visibility.includes('内部')) {
              privateFlag = true;
              isInternal = true;
            }

            core.setOutput('repo_name', repoNameClean);
            core.setOutput('private', privateFlag);
            core.setOutput('internal', isInternal);
            core.setOutput('description', data['仓库用途'] || '');
            core.setOutput('need_review', needCodeReview);
            core.setOutput('need_signed', needSignedCommits);
            core.setOutput('team_write', teamWrite || '');
            core.setOutput('team_admin', teamAdmin || '');

      # ========== 2. 创建新仓库 ==========
      - name: 创建新仓库
        id: create
        run: |
          REPO_NAME="${{ steps.parse.outputs.repo_name }}"
          PRIVATE="${{ steps.parse.outputs.private }}"
          INTERNAL="${{ steps.parse.outputs.internal }}"
          DESCRIPTION="${{ steps.parse.outputs.description }}"

          echo "正在创建仓库: $REPO_NAME"

          VISIBILITY="private"
          if [ "$PRIVATE" == "false" ]; then
            VISIBILITY="public"
          elif [ "$INTERNAL" == "true" ]; then
            VISIBILITY="internal"
          fi

          gh repo create "${{ env.ORG_NAME }}/$REPO_NAME" \
            --$VISIBILITY \
            --description "$DESCRIPTION"

          echo "::set-output name=repo_full::${{ env.ORG_NAME }}/$REPO_NAME"

      # ========== 3. 添加写入权限（用户/团队） ==========
      - name: 添加写入权限
        if: steps.parse.outputs.team_write != ''
        run: |
          REPO="${{ steps.create.outputs.repo_full }}"
          echo "${{ steps.parse.outputs.team_write }}" | while read -r line; do
            ENTITY=$(echo "$line" | sed 's/@//g' | xargs)
            if [ -z "$ENTITY" ]; then continue; fi

            # 先尝试作为用户添加协作者（写权限），失败则作为团队添加
            echo "处理: $ENTITY"
            if gh api -X PUT "repos/$REPO/collaborators/$ENTITY" -f permission="push" 2>/dev/null; then
              echo "✅ 已添加用户: $ENTITY"
            else
              echo "作为团队尝试..."
              gh api -X PUT "orgs/${{ env.ORG_NAME }}/teams/$ENTITY/repos/$REPO" -f permission="push"
              echo "✅ 已添加团队: $ENTITY"
            fi
          done

      # ========== 4. 添加管理员权限 ==========
      - name: 添加管理员权限
        if: steps.parse.outputs.team_admin != ''
        run: |
          REPO="${{ steps.create.outputs.repo_full }}"
          echo "${{ steps.parse.outputs.team_admin }}" | while read -r line; do
            ENTITY=$(echo "$line" | sed 's/@//g' | xargs)
            if [ -z "$ENTITY" ]; then continue; fi

            echo "处理管理员: $ENTITY"
            if gh api -X PUT "repos/$REPO/collaborators/$ENTITY" -f permission="admin" 2>/dev/null; then
              echo "✅ 已添加管理员用户: $ENTITY"
            else
              gh api -X PUT "orgs/${{ env.ORG_NAME }}/teams/$ENTITY/repos/$REPO" -f permission="admin"
              echo "✅ 已添加管理员团队: $ENTITY"
            fi
          done

      # ========== 5. 分支保护 ==========
      - name: 设置分支保护和代码审核
        if: steps.parse.outputs.need_review != '否（暂不设置）' && steps.parse.outputs.need_review != ''
        run: |
          REPO="${{ steps.create.outputs.repo_full }}"
          BRANCH="main"

          REVIEW_COUNT=1
          if [[ "${{ steps.parse.outputs.need_review }}" == *"至少 2 人"* ]]; then
            REVIEW_COUNT=2
          fi

          BODY=$(jq -n \
            --argjson count $REVIEW_COUNT \
            '{
              "required_status_checks": null,
              "enforce_admins": false,
              "required_pull_request_reviews": {
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": false,
                "required_approving_review_count": $count
              },
              "restrictions": null,
              "required_linear_history": false,
              "allow_force_pushes": false,
              "allow_deletions": false
            }')

          if [ "${{ steps.parse.outputs.need_signed }}" == "是" ]; then
            BODY=$(echo "$BODY" | jq '. + {required_signatures: true}')
          fi

          echo "更新分支保护规则..."
          gh api -X PUT "repos/$REPO/branches/$BRANCH/protection" \
            -H "Accept: application/vnd.github+json" \
            -f body="$BODY"

      # ========== 6. 启用安全扫描 ==========
      - name: 启用安全扫描
        run: |
          REPO="${{ steps.create.outputs.repo_full }}"
          gh api -X PATCH "repos/$REPO" \
            -f security_and_analysis='{
              "secret_scanning": {"status": "enabled"},
              "secret_scanning_push_protection": {"status": "enabled"}
            }' || echo "部分安全功能可能需要组织许可，已跳过"

      # ========== 7. 通知并关闭 Issue ==========
      - name: 回复申请者
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const repoFull = '${{ steps.create.outputs.repo_full }}';
            const repoUrl = `https://github.com/${repoFull}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ 仓库已自动创建：${repoUrl}\n已按申请配置权限、分支保护和安全扫描。`
            });

      - name: 关闭 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
