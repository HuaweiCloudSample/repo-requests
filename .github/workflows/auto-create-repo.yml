name: 自动创建仓库（审批通过后）

on:
  issues:
    types: [labeled]

jobs:
  create-repo:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
      ORG_NAME: ${{ github.repository_owner }}

    steps:
      - name: 解析 Issue 内容
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;

            function parseBody(body) {
              const lines = body.split('\n');
              const info = {};
              let currentKey = '';
              for (const line of lines) {
                const keyMatch = line.match(/^### (.+)/);
                if (keyMatch) {
                  currentKey = keyMatch[1].trim();
                  info[currentKey] = '';
                  continue;
                }
                if (line.startsWith('<!--') || line.trim() === '') continue;
                if (currentKey && info[currentKey] !== undefined) {
                  info[currentKey] += line.trim() + '\n';
                }
              }
              for (const key in info) {
                info[key] = info[key].trim();
              }
              return info;
            }

            const data = parseBody(issueBody);

            const repoNameRaw = data['建议的仓库名称'];
            const visibility = data['仓库可见性'] || '私有';
            const teamWriteRaw = data['需要写入权限的成员或团队'];
            const teamAdminRaw = data['需要管理员权限的维护者'];
            const needCodeReview = data['是否启用强制代码审核（PR + 审批）？'];
            const needSignedCommits = data['是否要求提交签名（Verified commits）？'];

            if (!repoNameRaw) throw new Error('未找到仓库名称');

            // 清理仓库名
            let repoNameClean = repoNameRaw.split('/').pop();
            repoNameClean = repoNameClean.replace(/\s+/g, '-')
                                         .replace(/[^a-zA-Z0-9\-_.]/g, '')
                                         .toLowerCase()
                                         .replace(/^-+|-+$/g, '');   // 去掉首尾连字符

            if (!repoNameClean || repoNameClean.length < 1) {
              throw new Error('仓库名无效，清理后为空');
            }

            let privateFlag = true, isInternal = false;
            if (visibility.includes('公开')) { privateFlag = false; }
            else if (visibility.includes('内部')) { isInternal = true; }

            // 将多分隔符的字符串拆分成数组（换行、逗号、空格）
            function splitEntities(raw) {
              if (!raw) return [];
              return raw.split(/[\n,]+/)               // 先按换行和逗号拆
                        .flatMap(s => s.split(/\s+/))  // 再按空格拆
                        .map(s => s.trim().replace(/^@+/, '')) // 去 @ 和首尾空白
                        .filter(s => s.length > 0);
            }

            const teamWriteList = splitEntities(teamWriteRaw);
            const teamAdminList = splitEntities(teamAdminRaw);

            core.setOutput('repo_name', repoNameClean);
            core.setOutput('private', privateFlag);
            core.setOutput('internal', isInternal);
            core.setOutput('description', data['仓库用途'] || '');
            core.setOutput('need_review', needCodeReview);
            core.setOutput('need_signed', needSignedCommits);
            core.setOutput('team_write_json', JSON.stringify(teamWriteList));
            core.setOutput('team_admin_json', JSON.stringify(teamAdminList));

      - name: 创建新仓库
        id: create
        run: |
          REPO_NAME="${{ steps.parse.outputs.repo_name }}"
          PRIVATE="${{ steps.parse.outputs.private }}"
          INTERNAL="${{ steps.parse.outputs.internal }}"
          DESCRIPTION="${{ steps.parse.outputs.description }}"

          echo "仓库名称: $REPO_NAME"
          VISIBILITY="private"
          [ "$PRIVATE" == "false" ] && VISIBILITY="public"
          [ "$INTERNAL" == "true" ] && VISIBILITY="internal"

          gh repo create "${{ env.ORG_NAME }}/$REPO_NAME" \
            --$VISIBILITY \
            --description "$DESCRIPTION"

          echo "::set-output name=repo_full::${{ env.ORG_NAME }}/$REPO_NAME"

      - name: 添加写入权限
        if: steps.parse.outputs.team_write_json != '[]'
        run: |
          REPO="${{ steps.create.outputs.repo_full }}"
          echo '${{ steps.parse.outputs.team_write_json }}' | jq -r '.[]' | while read ENTITY; do
            [ -z "$ENTITY" ] && continue
            echo "处理: $ENTITY"
            if gh api -X PUT "repos/$REPO/collaborators/$ENTITY" -f permission="push" 2>/dev/null; then
              echo "✅ 已添加用户: $ENTITY"
            else
              echo "尝试作为团队: $ENTITY"
              gh api -X PUT "orgs/${{ env.ORG_NAME }}/teams/$ENTITY/repos/$REPO" -f permission="push" || \
              echo "⚠️  $ENTITY 添加失败，请检查该用户名/团队是否存在以及 token 权限"
            fi
          done

      - name: 添加管理员权限
        if: steps.parse.outputs.team_admin_json != '[]'
        run: |
          REPO="${{ steps.create.outputs.repo_full }}"
          echo '${{ steps.parse.outputs.team_admin_json }}' | jq -r '.[]' | while read ENTITY; do
            [ -z "$ENTITY" ] && continue
            echo "处理管理员: $ENTITY"
            if gh api -X PUT "repos/$REPO/collaborators/$ENTITY" -f permission="admin" 2>/dev/null; then
              echo "✅ 已添加管理员用户: $ENTITY"
            else
              echo "尝试作为团队: $ENTITY"
              gh api -X PUT "orgs/${{ env.ORG_NAME }}/teams/$ENTITY/repos/$REPO" -f permission="admin" || \
              echo "⚠️  $ENTITY 管理员添加失败"
            fi
          done

      - name: 设置分支保护
        if: steps.parse.outputs.need_review != '否（暂不设置）' && steps.parse.outputs.need_review != ''
        run: |
          REPO="${{ steps.create.outputs.repo_full }}"
          BRANCH="main"
          REVIEW_COUNT=1
          [[ "${{ steps.parse.outputs.need_review }}" == *"2 人"* ]] && REVIEW_COUNT=2

          BODY=$(jq -n --argjson count $REVIEW_COUNT '{
            required_status_checks: null,
            enforce_admins: false,
            required_pull_request_reviews: {
              dismiss_stale_reviews: true,
              require_code_owner_reviews: false,
              required_approving_review_count: $count
            },
            restrictions: null,
            required_linear_history: false,
            allow_force_pushes: false,
            allow_deletions: false
          }')
          [ "${{ steps.parse.outputs.need_signed }}" == "是" ] && BODY=$(echo "$BODY" | jq '. + {required_signatures: true}')

          gh api -X PUT "repos/$REPO/branches/$BRANCH/protection" \
            -H "Accept: application/vnd.github+json" \
            -f body="$BODY"

      - name: 启用安全扫描
        run: |
          REPO="${{ steps.create.outputs.repo_full }}"
          gh api -X PATCH "repos/$REPO" -f security_and_analysis='{
            "secret_scanning": {"status":"enabled"},
            "secret_scanning_push_protection": {"status":"enabled"}
          }' || echo "安全扫描启用失败，可能需组织许可"

      - name: 通知完成并关闭 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const repoFull = '${{ steps.create.outputs.repo_full }}';
            const repoUrl = `https://github.com/${repoFull}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ 仓库已自动创建：${repoUrl}\n权限、分支保护、安全扫描已配置。`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
